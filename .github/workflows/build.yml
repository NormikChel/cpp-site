name: Build C++ Binary

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Скачиваем наш код
        uses: actions/checkout@v4

      - name: Скачиваем библиотеку cpp-httplib
        uses: actions/checkout@v4
        with:
          repository: yhirose/cpp-httplib
          path: cpp-httplib

      - name: Ставим g++, nlohmann-json, OpenSSL и libpq-dev
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends g++ nlohmann-json3-dev libssl-dev libpq-dev postgresql-client
          pg_config --includedir
          find /usr/include -name "libpq-fe.h"

      - name: Копируем httplib.h и компилируем C++ (-O3)
        run: |
          cp cpp-httplib/httplib.h .
          PQ_INC="$(pg_config --includedir)"
          g++ -O3 main.cpp -o server -I/usr/include/nlohmann -I"$PQ_INC" -lpq -lcrypto -lpthread

      - name: Заливаем готовый бинарник в репозиторий
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f server
          git commit -m "Build RUTTR binary" || exit 0
          git push