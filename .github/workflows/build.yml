name: Build C++ Binary

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Ставим g++, libcurl и nlohmann-json
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libcurl4-openssl-dev nlohmann-json3-dev git

      - name: Скачиваем библиотеку cpp-httplib
        run: |
          git clone --depth 1 https://github.com
          cp cpp-httplib/httplib.h .

      - name: Компилируем C++ с оптимизацией -O3
        run: g++ -O3 main.cpp -o server -I/usr/include/nlohmann -lcurl -lpthread

      - name: Заливаем готовый бинарник в репозиторий
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f server
          git commit -m "Build binary" || exit 0
          git push
