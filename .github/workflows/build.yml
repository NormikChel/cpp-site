name: Build C++ Binary

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Скачиваем наш код
        uses: actions/checkout@v4

      - name: Скачиваем библиотеку cpp-httplib
        uses: actions/checkout@v4
        with:
          repository: yhirose/cpp-httplib
          path: cpp-httplib

      - name: Ставим g++, nlohmann-json, OpenSSL и SQLite3
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ nlohmann-json3-dev libssl-dev libsqlite3-dev

      - name: Копируем httplib.h и компилируем C++ (-O3)
        run: |
          cp cpp-httplib/httplib.h .
          g++ -O3 main.cpp -o server -I/usr/include/nlohmann -lsqlite3 -lcrypto -lpthread

      - name: Заливаем готовый бинарник в репозиторий
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f server
          git commit -m "Build RUTTR binary" || exit 0
          git push
